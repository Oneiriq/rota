name: image

# Publishes the daemon image on main pushes. The shaman deployment
# (nixos-prodot-my kubernetes/apps/data/rota) pins these tags; the
# previous ghcr package was deleted at some point and the host ran a
# years-cached copy, which is exactly the failure mode a CI publish
# prevents.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/oneiriq/rota:${{ github.sha }}
            ghcr.io/oneiriq/rota:latest
